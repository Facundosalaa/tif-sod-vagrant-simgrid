[defaults]
inventory = inventory.ini
host_key_checking = False
interpreter_python = /usr/bin/python3
stdout_callback = default
callback_result_format = yaml
forks = 10
retry_files_enabled = False
# Si una tarea falla, igual correr los handlers pendientes (por ejemplo, el
# reinicio de Prometheus tras cambiar su configuración).
force_handlers = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o UserKnownHostsFile=/dev/null
